<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cinema Sign</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222222;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
}

#text{
    color:#E2E2E2;

    font-size:170px;
    font-weight:900;

    text-align:center;
    white-space:nowrap;

    text-shadow:
        0 0 2px rgba(255,255,255,.18),
        0 0 5px rgba(255,255,255,.08);

    transform:scale(1);

    max-width:90vw;
}
</style>
</head>

<body>

<div id="text">A</div>

<script>
const params = new URLSearchParams(window.location.search);
let text = (params.get("text") || "A").toUpperCase();

const el = document.getElementById("text");
el.textContent = text;

// Tự co nếu chữ dài
if(text.length>=4){
    el.style.fontSize="120px";
}
if(text.length>=7){
    el.style.fontSize="90px";
}
</script>

</body>
</html>
