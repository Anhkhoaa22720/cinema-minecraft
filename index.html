<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cinema Sign</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    font-family: Arial, Helvetica, sans-serif;
}

#top-half {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #141414;
}

#text {
    color: #9a9a9a;
    font-size: 105px;
    font-weight: 900;
    line-height: 1;

    text-align: center;
    white-space: nowrap;

    text-shadow:
        0 0 1px rgba(255,255,255,0.08);

    user-select: none;
}

#bottom-half {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 50%;

    background: #080808;
}
</style>
</head>

<body>

<div id="top-half">
    <div id="text"></div>
</div>

<div id="bottom-half"></div>

<script>
const params = new URLSearchParams(window.location.search);
const text = (params.get("text") || "A").toUpperCase();

const el = document.getElementById("text");
el.textContent = text;

if (text.length >= 4) {
    el.style.fontSize = "75px";
}

if (text.length >= 7) {
    el.style.fontSize = "55px";
}
</script>

</body>
</html>
